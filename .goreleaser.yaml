version: 2
project_name: kubed

builds:
  - main: ./cmd/kubed
    binary: kubed
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{ .Version }}"]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc

brews:
  - name: kubed
    repository:
      owner: s3cretagent
      name: homebrew-tap
    directory: Formula
    homepage: https://github.com/s3cretagent/kubed
    description: A plain-language Kubernetes terminal UI
    license: MIT
    commit_author:
      name: s3cretagent
      email: shubhgithub7@gmail.com
    commit_msg_template: "kubed {{ .Tag }}"
    test: |
      system "#{bin}/kubed", "--version"
